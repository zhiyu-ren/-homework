<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}用户管理系统{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="navbar-brand">
            <a href="/" class="brand-link">用户管理系统</a>
        </div>
        <div class="navbar-menu">
            {% if session.get("username") %}
                <span class="navbar-welcome">欢迎，{{ session.get("username") }}</span>
                <a href="/" class="nav-link">首页</a>
                <a href="/logout" class="nav-link nav-link-danger">退出</a>
            {% else %}
                <a href="/login" class="nav-link">登录</a>
                <a href="/register" class="nav-link">注册</a>
            {% endif %}
        </div>
    </nav>
    <main class="container">
        {% if error %}
        <div class="card card-error">
            <p class="error-text">{{ error }}</p>
        </div>
        {% endif %}
        {% if success %}
        <div class="card card-success">
            <p class="success-text">{{ success }}</p>
        </div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>
    <footer class="footer">
        <p>&copy; 2026 用户管理系统 | 安全加固版 v2.0</p>
    </footer>
</body>
</html>
