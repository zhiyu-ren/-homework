{% extends "base.html" %}
{% block title %}上传头像 - 用户管理系统{% endblock %}
{% block content %}
<div class="card upload-card">
    <h2 class="card-title">📸 上传头像</h2>
    <p class="card-subtitle">选择一张图片作为您的个人头像</p>

    {% if success %}
    <div class="alert alert-success">✅ 文件上传成功！</div>
    <div class="upload-preview" style="text-align:center; margin:20px 0;">
        <img src="{{ file_url }}" alt="头像预览" style="max-width:200px; max-height:200px; border-radius:10px; border:2px solid #1a73e8;">
        <p style="margin-top:10px; color:#666;">文件：{{ filename }}</p>
        <p style="margin-top:5px;">
            <a href="{{ file_url }}" target="_blank" class="link">🔗 打开文件链接</a>
        </p>
    </div>
    <hr style="border:none;border-top:1px solid #eee;margin:20px 0;">
    <p style="text-align:center;"><a href="/upload" class="btn btn-primary">继续上传</a></p>
    {% endif %}

    {% if error %}
    <div class="alert alert-error">❌ {{ error }}</div>
    {% endif %}

    <form method="post" action="/upload" enctype="multipart/form-data" class="form">
        <div class="form-group">
            <label for="file">选择文件</label>
            <input type="file" id="file" name="file" class="form-input" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">上 传</button>
    </form>

    <div class="form-footer" style="margin-top:20px;">
        <a href="/" class="link">← 返回首页</a>
    </div>
</div>
{% endblock %}
