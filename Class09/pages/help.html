<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>帮助中心</title></head>
<body>
<h1>📖 帮助中心</h1>
<p>欢迎使用用户管理系统！以下是常见问题解答。</p>

<h3>🔐 如何登录？</h3>
<p>在登录页面输入您的用户名和密码即可登录。默认管理员账号：admin</p>

<h3>📝 如何注册？</h3>
<p>点击导航栏的"注册"按钮，填写用户名、密码、邮箱和手机号即可完成注册。</p>

<h3>🔍 如何搜索用户？</h3>
<p>登录后，在首页的搜索框中输入用户名或邮箱关键词，点击搜索即可。</p>

<h3>📸 如何上传头像？</h3>
<p>登录后点击"上传头像"，选择 JPG/PNG/GIF 格式的图片文件即可。</p>

<h3>💰 如何充值？</h3>
<p>登录后进入"个人中心"，在充值表单中输入金额即可充值到余额。</p>

<h3>💡 提示</h3>
<p>在 /page 路由中尝试修改 name 参数可以加载不同页面。</p>
</body>
</html>
